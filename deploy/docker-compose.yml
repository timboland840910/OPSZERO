version: '3'

services:
  service1:
    image: service1:latest
    build:
      context: ./service1
    ports:
      - "8080:8080"
    environment:
      - ENV_VAR=value

  service2:
    image: service2:latest
    build:
      context: ./service2
    ports:
      - "8081:8080"
    environment:
      - ENV_VAR=value

  service3:
    image: service3:latest
    build:
      context: ./service3
    ports:
      - "8082:8080"
    environment:
      - ENV_VAR=value
